# Деплой сайта на GitHub Pages.
# Правило проекта: деплой только из main и только папки dist/ (решение Р4).
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  # Ручной запуск из вкладки Actions (тоже только для main — см. условие ниже)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; уже идущий не отменяем
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Ручной запуск можно выбрать на любой ветке — не даём выложить не-main
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build dist/ (белый список файлов)
        run: bash scripts/assemble_site.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
